:root{
  --page:#E9EBEE; --ink:#17130C; --dim:#6F675A; --line:#D8DCE1;
  --amber:#009DE5; --amber-d:#0078B4;
  --mono:'JetBrains Mono','Noto Sans SC',ui-monospace,Consolas,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  background:var(--page); color:var(--ink);
  font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
  display:flex; flex-direction:column; overflow:hidden;
}
header{
  display:none; /* 嵌入落地页形态：隐藏顶部控制条（DOM 保留，JS 绑定与快捷键不受影响） */
  flex:0 0 auto; align-items:center; gap:14px; flex-wrap:wrap;
  padding:12px 22px; background:#F2F3F5; border-bottom:1px solid var(--line);
}
.brand{display:flex; align-items:center; gap:10px; font:700 14px var(--mono); letter-spacing:.08em}
.brand .dia{width:11px;height:11px;background:var(--amber);border-radius:3px;flex:0 0 auto}
.brand em{font:400 12px var(--mono); font-style:normal; color:var(--dim); letter-spacing:.06em}
header .sp{flex:1}
button{
  font:500 13px var(--mono); color:var(--ink); background:#fff;
  border:1px solid var(--line); border-radius:8px; padding:7px 14px;
  cursor:pointer; transition:border-color .15s, color .15s, background .15s;
  letter-spacing:.04em;
}
button:hover{border-color:var(--amber-d); color:var(--amber-d)}
button:focus-visible{outline:2px solid var(--amber-d); outline-offset:2px}
button:disabled{opacity:.35; cursor:default}
button:disabled:hover{border-color:var(--line); color:var(--ink)}
button.primary{background:var(--ink); color:#fff; border-color:var(--ink); font-weight:700}
button.primary:hover{background:#332B1D}
.recdot{width:9px;height:9px;border-radius:50%;background:#E03131;display:none}
body.rec .recdot{display:block; animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.15}}
#stage{flex:1; display:flex; align-items:center; justify-content:center; padding:18px; min-height:0}
@supports not (aspect-ratio: 16/9){ #frame{height:56.25vw} }
#frame{position:relative; max-width:100%; max-height:100%; aspect-ratio:16/9;
  width:min(100%, calc((100vh - 40px) * 16 / 9));
  border:1px solid var(--line); border-radius:12px; overflow:hidden; background:var(--page);
  box-shadow:0 24px 70px rgba(23,19,12,.14);
}
canvas{width:100%; height:100%; display:block; background:var(--page); cursor:pointer}
#poster{
  position:absolute; inset:0; z-index:6; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:22px;
  background:rgba(233,235,238,.25); backdrop-filter:blur(1.5px);
}
#poster.hide{display:none}
#btnBig{
  width:112px; height:112px; border-radius:50%; background:var(--ink); color:#fff;
  border:none; display:flex; align-items:center; justify-content:center;
  font-size:34px; padding:0; position:relative; transition:transform .18s;
}
#btnBig:hover{transform:scale(1.06); background:#332B1D; color:#fff}
#btnBig::after{
  content:''; position:absolute; inset:-10px; border-radius:50%;
  border:1.5px solid rgba(23,19,12,.35); animation:ring 1.9s ease-out infinite;
}
@keyframes ring{0%{transform:scale(.82);opacity:0} 30%{opacity:1} 100%{transform:scale(1.18);opacity:0}}
@media (prefers-reduced-motion: reduce){ #btnBig::after{animation:none} }
#poster .cap{font:500 13px var(--mono); color:var(--dim); letter-spacing:.22em}
#poster .cap b{color:var(--ink)}
#endcard{
  position:absolute; inset:0; display:none; align-items:center; justify-content:center;
  gap:14px; background:rgba(233,235,238,.6); backdrop-filter:blur(3px); z-index:5;
}
#endcard.show{display:flex}
#endcard button{padding:12px 26px; font-size:14px}
footer{
  display:none; /* 嵌入落地页形态：隐藏底部说明栏 */
  flex:0 0 auto; gap:10px 18px; align-items:center; flex-wrap:wrap;
  padding:9px 22px; background:#F2F3F5; border-top:1px solid var(--line);
  font:400 12px var(--mono); color:var(--dim); letter-spacing:.03em;
}
footer .sp{flex:1}
kbd{border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:1px 6px;
  font:500 11px var(--mono); background:#fff}
#toast{
  position:fixed;left:50%;bottom:54px;transform:translateX(-50%) translateY(8px);
  background:#17130C;color:#F2F3F5;font:400 13px var(--mono);padding:10px 18px;border-radius:8px;
  opacity:0;pointer-events:none;transition:.25s;z-index:9;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<header>
  <div class="brand"><span class="dia"></span>XMARK <em>/ 15s 概念宣传片</em></div>
  <span class="recdot" title="录制中"></span>
  <span class="sp"></span>
  <button id="btnPlay">播放</button>
  <button id="btnMute">静音</button>
  <button id="btnReplay">重播</button>
  <button id="btnExport" class="primary">导出视频(含配乐)</button>
  <button id="btnFull">全屏</button>
</header>
<div id="stage">
  <div id="frame">
    <canvas id="cv" width="1920" height="1080"></canvas>
    <div id="poster">
      <button id="btnBig" aria-label="播放影片">▶</button>
      <div class="cap"><b>15 秒</b> · 点击播放 · <b>含配乐</b></div>
    </div>
    <div id="endcard">
      <button id="btnReplay2">▶&nbsp;重播</button>
      <button id="btnExport2">导出视频</button>
    </div>
  </div>
</div>
<footer>
  <span>1080p · 60fps · 15.0s · 配乐为代码实时合成</span>
  <span class="sp"></span>
  <span><kbd>空格</kbd> 播放/暂停</span>
  <span><kbd>←</kbd><kbd>→</kbd> 逐秒</span>
  <span><kbd>M</kbd> 静音</span>
  <span><kbd>R</kbd> 重播</span>
  <span><kbd>E</kbd> 导出</span>
</footer>
<div id="toast"></div>

<script>
'use strict';
/* ════════════════════════════════════════════════════════════════
   XMARK · 15s「窗口舞台 · 灰阶上色」(创意引擎自动定案 A)
   打开 x.com 的瞬间世界是灰的;XMark 点过之处,颜色回来:
   备注=上色、截图=定格彩照、广告=消散。舞台是一只 Chrome 窗口,
   主角是光标。冷灰 UI × 品牌蓝标记色;D-dorian 125BPM backbeat。
   render(t) 纯函数;残影/粒子均为解析采样。
   ════════════════════════════════════════════════════════════════ */
const W=1920, H=1080, DUR=15, FPS=60;
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');

function showFatal(head, detail){
  try{
    ctx.setTransform(1,0,0,1,0,0);
    ctx.fillStyle='#E9EBEE'; ctx.fillRect(0,0,W,H);
    ctx.textAlign='left'; ctx.textBaseline='alphabetic';
    ctx.fillStyle='#E03131'; ctx.font='700 34px monospace';
    ctx.fillText(head, 90, 140);
    ctx.fillStyle='#17130C'; ctx.font='22px monospace';
    String(detail).split('\n').slice(0,10).forEach((l,i)=>{
      ctx.fillText(l.slice(0,100), 90, 210+i*34);
    });
  }catch(_){}
}
window.addEventListener('error', e=>{
  playing=false; showFatal('RUNTIME ERROR', e.message+'\n@ '+(e.filename||'')+' '+(e.lineno||''));
});
window.addEventListener('unhandledrejection', e=>showFatal('PROMISE REJECT', String(e.reason&&e.reason.message||e.reason)));
if(!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){
    if(typeof r==='undefined')r=0; if(typeof r!=='number')r=Number(r[0])||0;
    r=Math.min(r,w/2,h/2);
    this.moveTo(x+r,y);this.arcTo(x+w,y,x+w,y+h,r);this.arcTo(x+w,y+h,x,y+h,r);
    this.arcTo(x,y+h,x,y,r);this.arcTo(x,y,x+w,y,r);this.closePath();return this;};
}

/* ── 1. 设计令牌(冷灰 UI 世界 × 琥珀标记色) ── */
const PAGE='#E9EBEE', WIN='#FFFFFF', INK='#17130C',
      DIM='#6F675A', FAINT='#A8ADB4', LINE='#E4E7EB',
      AMBER='#009DE5', AMBERD='#0078B4';
/* 灰阶 → 真彩(上色即记忆) */
const G_AVATAR='#C9CDD2', G_NAME='#B7BCC2', G_TEXT='#CBD0D6', G_HEART='#D3D7DC';
const C_AVATARS=['#4263EB','#0CA89F','#E03131'];
const CJK =`'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif`;
const LAT =`'Space Grotesk','Noto Sans SC',sans-serif`;
const MONO=`'JetBrains Mono','Noto Sans SC',ui-monospace,Consolas,monospace`;

const SCENES=[
  {id:'open', t0:0,  t1:2},
  {id:'note', t0:2,  t1:4},
  {id:'shot', t0:4,  t1:6},
  {id:'clean',t0:6,  t1:8},
  {id:'panel',t0:8,  t1:10},
  {id:'merge',t0:10, t1:12},
  {id:'cta',  t0:12, t1:15},
];

/* ── 2. 数学 ── */
const clamp01=v=>v<0?0:v>1?1:v, lerp=(a,b,p)=>a+(b-a)*p;
const easeOutExpo=p=>p>=1?1:1-Math.pow(2,-10*p);
const easeInExpo=p=>p<=0?0:Math.pow(2,10*p-10);
const easeOutCubic=p=>1-Math.pow(1-p,3);
const easeInCubic=p=>p*p*p;
const easeInOut=p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
const easeOutBack=(p,s=1.70158)=>1+(s+1)*Math.pow(p-1,3)+s*Math.pow(p-1,2);
const ph=(lt,a,d)=>clamp01((lt-a)/d);
const bez=(t,x0,y0,x1,y1,x2,y2)=>{const u=1-t;
  return [u*u*x0+2*u*t*x1+t*t*x2, u*u*y0+2*u*t*y1+t*t*y2];};
function hexLerp(c1,c2,p){
  const a=parseInt(c1.slice(1),16), b=parseInt(c2.slice(1),16);
  const r=Math.round(lerp(a>>16,b>>16,p)), g=Math.round(lerp((a>>8)&255,(b>>8)&255,p)),
        bl=Math.round(lerp(a&255,b&255,p));
  return `rgb(${r},${g},${bl})`;
}

/* ── 3. 基元 ── */
function text(g,str,x,y,o={}){
  const {w=500,size=40,family=CJK,fill=INK,align='left',base='alphabetic',
         track=0,alpha=1,rise=null}=o;
  g.save(); g.globalAlpha*=alpha;
  g.font=`${w} ${size}px ${family}`; g.fillStyle=fill; g.textBaseline=base;
  if(!track&&!rise){ g.textAlign=align; g.fillText(str,x,y); g.restore(); return; }
  const chars=[...str], ws=chars.map(c=>g.measureText(c).width);
  const total=ws.reduce((a,b)=>a+b,0)+track*(chars.length-1);
  let sx=align==='center'?x-total/2:align==='right'?x-total:x;
  chars.forEach((c,i)=>{
    let cy=y,a=1;
    if(rise){ const p=ph(rise.lt||0,(rise.at||0)+i*(rise.st||.06),rise.dur||.5);
      cy+=(1-easeOutExpo(p))*(rise.h==null?84:rise.h); a=clamp01(p*2.2); }
    g.globalAlpha=alpha*a; g.textAlign='left'; g.fillText(c,sx,cy); sx+=ws[i]+track;
  });
  g.restore();
}
function monoLabel(g,str,x,y,size,fill,align='left',track=0,alpha=1,w=500){
  text(g,str,x,y,{w,size,family:MONO,fill,align,track,alpha});
}
function softShadow(g,blur=40,oy=16,a=.10){
  g.shadowColor=`rgba(23,19,12,${a})`; g.shadowBlur=blur; g.shadowOffsetY=oy;
}
function noShadow(g){ g.shadowColor='transparent'; g.shadowBlur=0; g.shadowOffsetY=0; }
function drawCursor(g,x,y,s=1,press=0){
  g.save(); g.translate(x,y); const k=s*(1-press*.2); g.scale(k,k);
  g.lineJoin='round'; g.lineWidth=3.4; g.strokeStyle='#FFFFFF'; g.fillStyle=AMBER;
  g.beginPath();
  g.moveTo(0,0); g.lineTo(0,38); g.lineTo(9.5,29); g.lineTo(15.5,42); g.lineTo(21,39);
  g.lineTo(15,27); g.lineTo(26,26); g.closePath();
  g.fill(); g.stroke(); g.restore();
}
function ripple(g,x,y,p){
  if(p<=0||p>=1) return;
  g.save(); g.strokeStyle=AMBERD; g.globalAlpha=(1-p)*.75; g.lineWidth=3*(1-p*.4);
  g.beginPath(); g.arc(x,y,14+70*easeOutCubic(p),0,7); g.stroke(); g.restore();
}
function drawX(g,x,y,s,color,alpha=1,lw=null){
  g.save(); g.globalAlpha*=alpha; g.strokeStyle=color;
  g.lineWidth=lw||s*.42; g.lineCap='round';
  g.beginPath(); g.moveTo(x-s,y-s); g.lineTo(x+s,y+s);
  g.moveTo(x+s,y-s); g.lineTo(x-s,y+s); g.stroke(); g.restore();
}
function drawMark(g,x,y,s,alpha=1,rot=0,check=true){
  g.save(); g.translate(x,y); g.rotate(rot); g.globalAlpha*=alpha;
  g.fillStyle=AMBER;
  g.beginPath(); g.roundRect(-s/2,-s/2,s,s,s*.26); g.fill();
  if(check&&s>=42){
    g.strokeStyle='#FFFFFF'; g.lineWidth=s*.105; g.lineCap='round'; g.lineJoin='round';
    g.beginPath(); g.moveTo(-s*.19,-s*.01); g.lineTo(-s*.04,s*.15); g.lineTo(s*.23,-s*.16);
    g.stroke();
  }
  g.restore();
}
function star(g,x,y,r,fill){
  g.save(); g.translate(x,y); g.beginPath();
  for(let i=0;i<10;i++){
    const rr=i%2?r*.45:r, a=-Math.PI/2+i*Math.PI/5;
    i?g.lineTo(Math.cos(a)*rr,Math.sin(a)*rr):g.moveTo(Math.cos(a)*rr,Math.sin(a)*rr);
  }
  g.closePath(); g.fillStyle=fill; g.fill(); g.restore();
}
function arrowNE(g,x,y,s,stroke){
  g.save(); g.strokeStyle=stroke; g.lineWidth=Math.max(2.5,s*.16); g.lineCap='round';
  g.beginPath(); g.moveTo(x-s*.55,y+s*.55); g.lineTo(x+s*.5,y-s*.5);
  g.moveTo(x-s*.05,y-s*.5); g.lineTo(x+s*.5,y-s*.5); g.lineTo(x+s*.5,y+s*.05);
  g.stroke(); g.restore();
}

/* 信息流卡:cp=上色进度(0 灰阶 → 1 真彩) */
function tweetCard(g,x,y,w,h,cp,{lines=3,ci=0,scale=1,alpha=1,ad=false,note=null}={}){
  g.save(); g.globalAlpha=alpha;
  g.translate(x,y); g.scale(scale,scale);
  softShadow(g,18,7,.07);
  g.fillStyle=WIN; g.beginPath(); g.roundRect(0,0,w,h,14); g.fill();
  noShadow(g);
  if(cp>0){ g.fillStyle=AMBER; g.beginPath(); g.roundRect(0,14,5,h-28,3); g.fill(); }
  g.fillStyle=hexLerp(G_AVATAR,C_AVATARS[ci%3],cp);
  g.beginPath(); g.arc(56,h/2-6,30,0,7); g.fill();
  if(cp>.5){ drawX(g,56,h/2-6,9,'#FFFFFF',cp,5); }
  const nx=110, nw=w-150;
  g.fillStyle=hexLerp(G_NAME,INK,cp);
  g.beginPath(); g.roundRect(nx,28,Math.min(220,nw*.3),16,8); g.fill();
  g.fillStyle=hexLerp(G_NAME,'#9AA0A6',cp);
  g.beginPath(); g.roundRect(nx,52,Math.min(150,nw*.22),11,6); g.fill();
  for(let i=0;i<lines;i++){
    g.fillStyle=hexLerp(G_TEXT,'#3A352C',cp);
    g.beginPath(); g.roundRect(nx,84+i*30,nw*(i===lines-1?.55:.86),13,7); g.fill();
  }
  [0,1,2].forEach(i=>{
    g.fillStyle=hexLerp(G_HEART, i===2?'#E03131':'#B9BEC5', cp);
    g.beginPath(); g.arc(nx+14+i*96, h-24, 9, 0, 7); g.fill();
  });
  if(ad){
    g.fillStyle='#F1F2F4'; g.beginPath(); g.roundRect(w-64,16,48,26,6); g.fill();
    monoLabel(g,'AD', w-40, 34, 14, FAINT,'center',1,1,700);
  }
  if(note){ drawNote(g, note.p, w-250, 18); }
  g.restore();
}
function drawNote(g,p,x,y){

/* ── 5. 光标旅程(全片解析轨迹) ── */
function cursorPos(t){
  if(t<1.0)  return [590+Math.min(5,Math.ceil((t-.5)/.09))*11, 244];
  if(t<1.35) return bez(easeInOut(ph(t,1.0,.35)), 650,244, 700,500, 780,560);
  if(t<2)    return [780+18*Math.sin((t-1.35)*4), 560+10*Math.cos((t-1.35)*3)];
  if(t<2.4)  return bez(easeInOut(ph(t,2.0,.4)), 780,560, 700,430, 388,508);
  if(t<2.6)  return [388,508];
  if(t<4)    return bez(easeInOut(ph(t,2.7,.3)), 388,508, 600,430, 900,470);
  if(t<4.25) return bez(easeInOut(ph(t,4.0,.25)), 900,470, 420,380, 348,432);
  if(t<4.75) return [lerp(348,1170,easeInOut(ph(t,4.25,.5))), lerp(432,720,easeInOut(ph(t,4.25,.5)))];
  if(t<6)    return [1170,720];
  if(t<6.32) return bez(easeInOut(ph(t,6.0,.32)), 1170,720, 800,520, 500,470);
  if(t<6.55) return [500,470];
  if(t<8)    return [760+36*Math.sin((t-6.6)*2.4), 585+16*Math.cos((t-6.6)*2)];
  if(t<8.5)  return bez(easeInOut(ph(t,8.0,.5)), 500,500, 900,360, 1210,352);
  if(t<9.4)  return bez(easeInOut(ph(t,8.5,.5)), 1210,352, 1250,430, 1240,480);
  if(t<10.35)return [1240+16*Math.sin((t-9.4)*5), 480];
  if(t<10.7) return bez(easeInCubic(ph(t,10.35,.35)), 1240,480, 1150,340, 960,330);
  return [960,330];
}

const grainTiles=[];
for(let k=0;k<3;k++){
  const c=document.createElement('canvas'); c.width=c.height=256;
  const gx=c.getContext('2d'), im=gx.createImageData(256,256);
  for(let i=0;i<im.data.length;i+=4){
    const v=112+Math.random()*88|0;
    im.data[i]=im.data[i+1]=im.data[i+2]=v; im.data[i+3]=255;
  }
  gx.putImageData(im,0,0); grainTiles.push(ctx.createPattern(c,'repeat'));
}
function render(t){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle=PAGE; ctx.fillRect(0,0,W,H);
  const sc=SCENES.find(s=>t>=s.t0&&t<s.t1)||SCENES[SCENES.length-1];
  const lt=t-sc.t0;
  if(sc.id==='cta'){ const z=1+.024*easeInCubic(ph(lt,1.2,1.8));
    ctx.translate(W/2,540); ctx.scale(z,z); ctx.translate(-W/2,-540); }
  ctx.save(); punchIn(ctx,lt);
  SCENE_DRAW[sc.id](ctx,lt);
  ctx.restore();
  for(const s2 of SCENES){
    if(s2.t0<=0) continue;
    const f=ph(t,s2.t0,.06);
    if(f>0&&f<1){ ctx.fillStyle=`rgba(255,255,255,${.55*(1-f)})`; ctx.fillRect(0,0,W,H); }
  }
  ctx.save(); ctx.globalAlpha=.025; ctx.globalCompositeOperation='multiply';
  const ox=(t*997|0)%256, oy=(t*761|0)%256;
  ctx.translate(-ox,-oy); ctx.fillStyle=grainTiles[(t*100|0)%3];
  ctx.fillRect(0,0,W+256,H+256); ctx.restore();
  const end=easeInExpo(ph(t,14.62,.36));
  if(end>0){ ctx.fillStyle=`rgba(233,235,238,${.4*end})`; ctx.fillRect(0,0,W,H); }
}

/* ── 8. 配乐:EDM track(Dm–Bb–F–C → 皮卡迪 D 大收)·125BPM ──
   真实感三件套:808 鼓组瞬态 / super saw 叠层 / convolver 混响 + sidechain 抽吸 */
const AudioEngine=(()=>{
  let ac=null, comp=null, master=null, duckBus=null, verb=null, verbGain=null,
      dly=null, dlyGain=null, dest=null, muted=false;
  const midi=m=>440*Math.pow(2,(m-69)/12);
  function ensure(){
    if(!ac){
      ac=new (window.AudioContext||window.webkitAudioContext)();
      comp=ac.createDynamicsCompressor();
      comp.threshold.value=-14; comp.ratio.value=4; comp.attack.value=.004; comp.release.value=.18;
      master=ac.createGain(); master.gain.value=muted?0:.85;
      master.connect(comp); comp.connect(ac.destination);
      dest=ac.createMediaStreamDestination(); comp.connect(dest);
      duckBus=ac.createGain(); duckBus.connect(master);          // 侧链总线(pad/bass/lead)
      // 卷积混响(程序生成 IR)
      verb=ac.createConvolver();
      const len=(ac.sampleRate*1.9)|0, buf=ac.createBuffer(2,len,ac.sampleRate);
      for(let ch=0;ch<2;ch++){ const d=buf.getChannelData(ch);
        for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6); }
      verb.buffer=buf;
      verbGain=ac.createGain(); verbGain.gain.value=.30;
      verb.connect(verbGain); verbGain.connect(master);
      // 反馈延迟(lead 空间)
      dly=ac.createDelay(1.2); dly.delayTime.value=.36;
      const fb=ac.createGain(); fb.gain.value=.32;
      const dlyLp=ac.createBiquadFilter(); dlyLp.type='lowpass'; dlyLp.frequency.value=3200;
      dly.connect(dlyLp); dlyLp.connect(fb); fb.connect(dly);
      dlyGain=ac.createGain(); dlyGain.gain.value=.22;
      dlyLp.connect(dlyGain); dlyGain.connect(master);
    }
    if(ac.state==='suspended') ac.resume().catch(()=>{});
    return ac;
  }
  /* sidechain:kick 触发时压 duck 总线 → EDM 抽吸感 */
  function duck(t,depth=.5,time=.26){
    const g=duckBus.gain;
    g.cancelScheduledValues(t);
    g.setValueAtTime(Math.max(.06,g.value),t);
    g.linearRampToValueAtTime(1-depth, t+.016);
    g.linearRampToValueAtTime(1, t+time);
  }
  let nb=null;
  function noiseBuf(){
    if(!nb){ nb=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate);
      const d=nb.getChannelData(0); for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1; }
    return nb;
  }
  /* ── 音色层(每音色都带 dry + reverb send) ── */
  function out(g, t, dur, verbAmt=.12){
    g.connect(duckBus._dry||master);   // 默认直通 master(鼓类);旋律类调用时传 bus
  }
  function kick(t,v=1){
    const o=ac.createOscillator(), g=ac.createGain();
    o.frequency.setValueAtTime(168,t);
    o.frequency.exponentialRampToValueAtTime(41,t+.095);
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(.95*v,t+.003);
    g.gain.exponentialRampToValueAtTime(.001,t+.24);
    o.connect(g); g.connect(master);
    const vs=ac.createGain(); vs.gain.value=.05; g.connect(vs); vs.connect(verb);
    o.start(t); o.stop(t+.3);
    duck(t);                                   // 侧链
  }
  function snare(t,v=.6){
    const src=ac.createBufferSource(); src.buffer=noiseBuf(); src.loop=true;
    const bp=ac.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=1900; bp.Q.value=.9;
    const g=ac.createGain();
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.5*v,t+.002);
    g.gain.exponentialRampToValueAtTime(.001,t+.17);
    src.connect(bp); bp.connect(g); g.connect(master);
    const vs=ac.createGain(); vs.gain.value=.22; g.connect(vs); vs.connect(verb);
    [189,331].forEach(f=>{                     // tonal body
      const o=ac.createOscillator(), og=ac.createGain();
      o.frequency.value=f;
      og.gain.setValueAtTime(.16*v,t); og.gain.exponentialRampToValueAtTime(.001,t+.09);
      o.connect(og); og.connect(master); o.start(t); o.stop(t+.1);
    });
    src.start(t); src.stop(t+.2);
  }
  function clap(t,v=.55){
    [0,.012,.026,.042].forEach((dt,i)=>{
      const src=ac.createBufferSource(); src.buffer=noiseBuf(); src.loop=true;
      const hp=ac.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=1100;
      const g=ac.createGain();
      const vv=(i===3?.42:.22)*v;
      g.gain.setValueAtTime(0,t+dt); g.gain.linearRampToValueAtTime(vv,t+dt+.001);
      g.gain.exponentialRampToValueAtTime(.001,t+dt+(i===3?.16:.03));
      src.connect(hp); hp.connect(g); g.connect(master);
      const vs=ac.createGain(); vs.gain.value=.26; g.connect(vs); vs.connect(verb);
      src.start(t+dt); src.stop(t+dt+.2);
    });
  }
  function hat(t,open=false,v=.5){
    const src=ac.createBufferSource(); src.buffer=noiseBuf(); src.loop=true;
    const hp=ac.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=8200;
    const g=ac.createGain();
    const d=open?.22:.045;
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.16*v,t+.001);
    g.gain.exponentialRampToValueAtTime(.001,t+d);
    src.connect(hp); hp.connect(g); g.connect(master);
    const vs=ac.createGain(); vs.gain.value=.05; g.connect(vs); vs.connect(verb);
    src.start(t); src.stop(t+d+.05);
  }
  function superSaw(t,f,dur,{vol=.2,det=16,n=5,lp=2600,a=.006,bus=null,lpEnd=null}={}){
    const g=ac.createGain(), flt=ac.createBiquadFilter();
    flt.type='lowpass'; flt.frequency.setValueAtTime(lp,t);
    if(lpEnd) flt.frequency.exponentialRampToValueAtTime(lpEnd,t+dur);
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+a);
    g.gain.setValueAtTime(vol,t+Math.max(a,dur-.05));
    g.gain.exponentialRampToValueAtTime(.001,t+dur);
    flt.connect(g);
    for(let i=0;i<n;i++){
      const o=ac.createOscillator(); o.type='sawtooth';
      o.frequency.value=f*Math.pow(2,((i-(n-1)/2)*det)/1200);
      o.connect(flt); o.start(t); o.stop(t+dur+.05);
    }
    g.connect(bus||duckBus);
    const vs=ac.createGain(); vs.gain.value=.16; g.connect(vs); vs.connect(verb);
  }
  function sub(t,f,dur,vol=.3){
    const o=ac.createOscillator(), g=ac.createGain();
    o.frequency.value=f; o.type='sine';
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.01);
    g.gain.setValueAtTime(vol,t+dur-.04); g.gain.exponentialRampToValueAtTime(.001,t+dur);
    o.connect(g); g.connect(duckBus);
    o.start(t); o.stop(t+dur+.05);
  }
  function lead(t,f,dur,vol=.16){
    superSaw(t,f,dur,{vol,det:22,n:3,lp:5200,a:.004,bus:duckBus});
    // delay send
    const g=ac.createGain(); g.gain.value=.5;
    const src=ac.createOscillator(); src.type='square'; src.frequency.value=f;
    const og=ac.createGain();
    og.gain.setValueAtTime(vol*.5,t); og.gain.exponentialRampToValueAtTime(.001,t+dur);
    src.connect(og); og.connect(g); g.connect(dly);
    src.start(t); src.stop(t+dur+.05);
  }
  function stab(t,ms,dur=.2,vol=.09){
    ms.forEach(m=>superSaw(t,midi(m),dur,{vol,det:12,n:3,lp:1900,a:.003}));
  }
  function crash(t,vol=.25){
    const src=ac.createBufferSource(); src.buffer=noiseBuf(); src.loop=true;
    const hp=ac.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=4800;
    const g=ac.createGain();
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.004);
    g.gain.exponentialRampToValueAtTime(.001,t+1.1);
    src.connect(hp); hp.connect(g); g.connect(master);
    const vs=ac.createGain(); vs.gain.value=.5; g.connect(vs); vs.connect(verb);
    src.start(t); src.stop(t+1.2);
  }
  function riser(t,d,v=.2){
    const src=ac.createBufferSource(); src.buffer=noiseBuf(); src.loop=true;
    const bp=ac.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=1.2;
    bp.frequency.setValueAtTime(220,t);
    bp.frequency.exponentialRampToValueAtTime(5200,t+d);
    const g=ac.createGain();
    g.gain.setValueAtTime(.001,t); g.gain.exponentialRampToValueAtTime(v,t+d);
    g.gain.linearRampToValueAtTime(0,t+d+.03);
    src.connect(bp); bp.connect(g); g.connect(master);
    src.start(t); src.stop(t+d+.05);
  }
  function click(t,f=1240,vol=.13){
    const o=ac.createOscillator(), g=ac.createGain();
    o.frequency.value=f;
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+.04);
    o.connect(g); g.connect(master);
    const vs=ac.createGain(); vs.gain.value=.1; g.connect(vs); vs.connect(verb);
    o.start(t); o.stop(t+.06);
  }
  function puff(t){
    const src=ac.createBufferSource(); src.buffer=noiseBuf(); src.loop=true;
    const bp=ac.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=1;
    bp.frequency.setValueAtTime(900,t);
    bp.frequency.exponentialRampToValueAtTime(260,t+.17);
    const g=ac.createGain();
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.11,t+.012);
    g.gain.exponentialRampToValueAtTime(.001,t+.17);
    src.connect(bp); bp.connect(g); g.connect(master);
    src.start(t); src.stop(t+.2);
  }
  /* motif:产品提示音美学(基音+非谐泛音=钟/木琴质感,大混响) */
  function motif(t,m,vol=.14,dur=.5){
    const f=midi(m);
    [[1,1],[2.76,.28],[5.4,.1]].forEach(([h,hv])=>{
      const o=ac.createOscillator(), g=ac.createGain();
      o.frequency.value=f*h;
      g.gain.setValueAtTime(vol*hv,t);
      g.gain.exponentialRampToValueAtTime(.0008,t+dur/(h*.6));
      o.connect(g); g.connect(duckBus);
      const vs=ac.createGain(); vs.gain.value=.55; g.connect(vs); vs.connect(verb);
      o.start(t); o.stop(t+dur+.05);
    });
  }
  function rim(t,v=.4){                          // rimshot:UI 点击的音乐化
    const src=ac.createBufferSource(); src.buffer=noiseBuf(); src.loop=true;
    const bp=ac.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=1720; bp.Q.value=3;
    const g=ac.createGain();
    g.gain.setValueAtTime(.28*v,t); g.gain.exponentialRampToValueAtTime(.001,t+.05);
    src.connect(bp); bp.connect(g); g.connect(master);
    const vs=ac.createGain(); vs.gain.value=.18; g.connect(vs); vs.connect(verb);
    src.start(t); src.stop(t+.07);
  }
  function shaker(t,v=.35){
    const src=ac.createBufferSource(); src.buffer=noiseBuf(); src.loop=true;
    const bp=ac.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=5600; bp.Q.value=1.4;
    const g=ac.createGain();
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.09*v,t+.03);
    g.gain.exponentialRampToValueAtTime(.001,t+.1);
    src.connect(bp); bp.connect(g); g.connect(master);
    src.start(t); src.stop(t+.12);
  }
  function padAdd9(t,ms,dur,vol=.07,lpA=420,lpB=2400){
    ms.forEach(m=>{
      superSaw(t,midi(m),dur,{vol:vol/Math.sqrt(ms.length),n:3,det:9,lp:lpA,lpEnd:lpB,a:dur*.4});
    });
  }
  function sparkle(t){
    [86,89,93].forEach((m,i)=>{
      const tt=t+i*.06;
      const o=ac.createOscillator(), g=ac.createGain();
      o.frequency.value=midi(m);
      g.gain.setValueAtTime(.12,tt); g.gain.exponentialRampToValueAtTime(.001,tt+.5);
      o.connect(g); g.connect(master);
      const vs=ac.createGain(); vs.gain.value=.6; g.connect(vs); vs.connect(verb);
      o.start(tt); o.stop(tt+.55);
    });
  }
  function hit(t){
    kick(t,.95);
    crash(t,.22);
    const o=ac.createOscillator(), g=ac.createGain();
    o.frequency.setValueAtTime(90,t); o.frequency.exponentialRampToValueAtTime(38,t+.7);
    g.gain.setValueAtTime(.3,t); g.gain.exponentialRampToValueAtTime(.001,t+.9);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t+.95);
  }
  /* ── 网格化作曲:和弦网格(1 小节=2s=1 幕);pad/bass 全程连续,层只增减;motif 固定应答位 ── */
  const CHX={
    Dm:{root:38, pad:[38,50,57,64,69], bass:[38,38,45,38,50,38,45,43], motif:[74,77,81,86]},
    Bb:{root:34, pad:[34,50,57,62,65], bass:[34,34,41,34,46,34,41,39], motif:[70,74,77,82]},
    F: {root:29, pad:[29,53,57,60,65], bass:[29,29,36,29,41,29,36,34], motif:[69,72,77,81]},
    C: {root:36, pad:[36,52,60,64,67], bass:[36,36,43,36,48,36,43,41], motif:[72,76,79,84]},
    DM:{root:38, pad:[38,50,57,66,69], bass:[38,38,45,38,50,38,45,45], motif:[74,78,81,86]},
  };
  let SCORE=null;
  function buildScore(){
    const ev=[], B=.5;
    const BARS=[[0,'Dm','intro'],[2,'Dm','build'],[4,'Bb','groove'],[6,'F','groove'],
                [8,'Bb','ambient'],[10,'C','build2'],[12,'DM','peak']];
    /* pad 全程 legato(和声底座不断线) */
    BARS.forEach(([t,n])=>ev.push([t,tt=>padAdd9(tt,CHX[n].pad,2.16,
      t>=12?.11 : t<2?.07 : .05, t<2?420:600, t>=12?3600:2200)]));
    /* intro:打字=动机种子(D4 上行音阶) */
    [62,64,65,67,69].forEach((m,i)=>ev.push([.5+i*.09,t=>click(t,midi(m)*4,.11)]));
    ev.push([1.05,t=>click(t,760,.14)]);
    ev.push([1.6,t=>riser(t,.4,.09)]);
    BARS.forEach(([t,n,tag])=>{
      const ch=CHX[n];
      /* 鼓网格:层随 tag 增减,进出带渐变 */
      if(tag==='build'){
        for(let i=0;i<4;i++) ev.push([t+i*B,tt=>kick(tt,i===0?.78:.62)]);
        for(let i=0;i<4;i++) ev.push([t+.25+i*.5,tt=>hat(tt,false,.4)]);
      }
      if(tag==='groove'){
        for(let i=0;i<4;i++) ev.push([t+i*B,tt=>kick(tt,i===0?.7:.58)]);
        ev.push([t+.5,tt=>rim(tt,.5)]); ev.push([t+1.5,tt=>rim(tt,.42)]);
        for(let i=0;i<4;i++) ev.push([t+.25+i*.5,tt=>hat(tt,false,.36)]);
        ev.push([t+1.25,tt=>hat(tt,false,.28)]); ev.push([t+1.33,tt=>shaker(tt,.45)]);
      }
      if(tag==='ambient'){
        ev.push([t+.5,tt=>shaker(tt,.36)]); ev.push([t+1.5,tt=>shaker(tt,.48)]);
      }
      if(tag==='build2'){
        for(let i=0;i<4;i++) ev.push([t+i*B,tt=>kick(tt,.58+i*.08)]);
        for(let i=0;i<8;i++) ev.push([t+.25+i*.22,tt=>shaker(tt,.4+i*.05)]);
      }
      if(tag==='peak'){
        ev.push([t,tt=>{kick(tt,.88); crash(tt,.2);}]);
        for(let i=1;i<3;i++) ev.push([t+i*B,tt=>kick(tt,.58)]);
        for(let i=0;i<3;i++) ev.push([t+.25+i*B,tt=>hat(tt,false,.3)]);
      }
      /* bass 全程(build 起;ambient 长音,peak 二分) */
      if(tag!=='intro'){
        if(tag==='ambient'){
          ev.push([t,tt=>sub(tt,midi(ch.root),1.9,.2)]);
          ev.push([t,tt=>superSaw(tt,midi(ch.root+12),1.8,{vol:.045,det:12,n:3,lp:700,a:.3})]);
        } else ch.bass.forEach((m,i)=>{
          if(tag==='peak'&&i%2) return;
          const bt=t+i*.25;
          ev.push([bt,tt=>sub(tt,midi(m),.22,.22)]);
          if(i%2===0) ev.push([bt,tt=>superSaw(tt,midi(m+12),.2,{vol:.06,det:14,n:3,lp:900})]);
        });
      }
      /* motif 固定网格位:build=上色同步(2.55 起);groove=句尾回声;ambient=中音区;build2=卡农;peak=陈述 */
      if(tag==='build')  ch.motif.forEach((m,i)=>ev.push([t+.55+i*.13,tt=>motif(tt,m,.095)]));
      if(tag==='groove'){ ev.push([t+1.5,tt=>motif(tt,ch.motif[2],.075)]);
                          ev.push([t+1.75,tt=>motif(tt,ch.motif[1],.065)]); }
      if(tag==='ambient') ch.motif.forEach((m,i)=>ev.push([t+.5+i*.2,tt=>motif(tt,m-12,.065,.45)]));
      if(tag==='build2'){
        ch.motif.forEach((m,i)=>ev.push([t+i*.16,tt=>motif(tt,m,.075)]));
        ch.motif.forEach((m,i)=>ev.push([t+1.0+i*.11,tt=>motif(tt,m,.095)]));
        ch.motif.forEach((m,i)=>ev.push([t+1.52+i*.11,tt=>motif(tt,m+12,.055)]));
      }
      if(tag==='peak'){
        ch.motif.forEach((m,i)=>{ ev.push([t+.3+i*.26,tt=>motif(tt,m,.15,.85)]);
                                  ev.push([t+.3+i*.26,tt=>motif(tt,m-12,.085,.85)]); });
      }
    });
    /* 拟音(事件位,混入同一总线与空间) */
    ev.push([2.42,t=>rim(t,1)]);                                  // 点击备注
    ev.push([4.78,t=>{click(t,3600,.2);click(t+.07,3000,.17);}]);  // 快门
    ev.push([6.33,t=>rim(t,.9)]);
    ev.push([6.38,puff]); ev.push([7.1,puff]); ev.push([7.62,puff]);
    /* 段尾 fill 与衔接 */
    [3.86,3.92,3.98].forEach((t2,i)=>ev.push([t2,tt=>rim(tt,.5+i*.15)]));
    ev.push([7.72,t=>{rim(t,.7);shaker(t+.1,.8);}]);
    ev.push([9.86,t=>kick(t,.45)]); ev.push([9.93,t=>kick(t,.5)]); // ambient→build2 预告
    /* logo 环完成 hit(落在 C 和弦张力位) */
    ev.push([11.0,t=>{kick(t,.9); crash(t,.15);
      const o=ac.createOscillator(), g=ac.createGain();
      o.frequency.setValueAtTime(90,t); o.frequency.exponentialRampToValueAtTime(38,t+.6);
      g.gain.setValueAtTime(.26,t); g.gain.exponentialRampToValueAtTime(.001,t+.8);
      o.connect(g); g.connect(master); o.start(t); o.stop(t+.85);}]);
    ev.push([11.15,t=>riser(t,.82,.14)]);
    ev.push([13.7,sparkle]);
    /* 尾:motif 尾音延留 */
    ev.push([14.25,t=>motif(t,86,.09,1.3)]);
    ev.push([14.25,t=>motif(t,74,.055,1.3)]);
    return ev;
  }
  function start(atFilm){
    ensure();
    if(!SCORE) SCORE=buildScore();
    const base=ac.currentTime+.06;
    for(const [t,fn] of SCORE){
      if(t>=atFilm-.01) try{ fn(base+(t-atFilm)); }catch(_){}
    }
    master.gain.cancelScheduledValues(ac.currentTime);
    master.gain.setValueAtTime(muted?0:.85, Math.max(ac.currentTime, base+(14.55-atFilm)));
    master.gain.linearRampToValueAtTime(.0001, base+(14.95-atFilm));
    return base;
  }
  function stop(){ if(ac){try{ac.close();}catch(_){}} ac=null; master=null; duckBus=null;
    verb=null; verbGain=null; dly=null; dlyGain=null; dest=null; }
  function setMuted(m){ muted=m; if(master&&ac) master.gain.setTargetAtTime(m?0:.85,ac.currentTime,.02); }
  return {start,stop,setMuted,get muted(){return muted},
          get stream(){ensure();return dest.stream;}};
})();

/* ── 9. 播放器 + 导出(工程骨架,与创意无关) ── */
let playing=false,tCur=0,startStamp=0,rafId=0,recording=false;
const $=id=>document.getElementById(id);
const endcard=$('endcard'),poster=$('poster'),toastEl=$('toast');
let toastTimer=0;
function say(m,ms=2600){toastEl.textContent=m;toastEl.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>toastEl.classList.remove('show'),ms);}
function draw(){render(Math.min(tCur,DUR));}
function loop(now){
  if(!playing) return;
  tCur=(now-startStamp)/1000;
  if(tCur>=DUR){tCur=DUR;playing=false;draw();onEnded();return;}
  draw(); rafId=requestAnimationFrame(loop);
}
function play(){
  if(recording&&tCur>=DUR) return;
  if(tCur>=DUR) tCur=0;
  playing=true; startStamp=performance.now()-tCur*1000;
  endcard.classList.remove('show'); $('btnPlay').textContent='暂停';
  AudioEngine.stop(); AudioEngine.start(tCur);
  cancelAnimationFrame(rafId); rafId=requestAnimationFrame(loop);
}
function pause(){playing=false;$('btnPlay').textContent='播放';AudioEngine.stop();draw();}
function toggle(){playing?pause():play();}
function seek(t){
  tCur=Math.max(0,Math.min(DUR,t));
  if(playing){AudioEngine.stop();AudioEngine.start(tCur);startStamp=performance.now()-tCur*1000;}
  if(tCur<DUR) endcard.classList.remove('show');
  draw();
}
function onEnded(){
  $('btnPlay').textContent='播放';
  AudioEngine.stop();
  if(!recording) endcard.classList.add('show');
}
async function exportWebM(){
  if(recording) return;
  if(!cv.captureStream||typeof MediaRecorder==='undefined'){say('当前浏览器不支持录制,请用 Chrome/Edge 打开');return;}
  const types=['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'];
  const mime=types.find(t=>MediaRecorder.isTypeSupported(t));
  if(!mime){say('当前浏览器不支持 WebM 录制');return;}
  recording=true; document.body.classList.add('rec');
  document.querySelectorAll('header button,#endcard button').forEach(b=>b.disabled=true);
  say('录制中——保持本标签页在前台(15 秒)',16000);
  const wasMuted=AudioEngine.muted;
  if(wasMuted) AudioEngine.setMuted(false);
  const vstream=cv.captureStream(FPS);
  const stream=new MediaStream([...vstream.getVideoTracks(),...AudioEngine.stream.getAudioTracks()]);
  const chunks=[];
  const rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:14_000_000});
  rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);
  const done=new Promise(res=>rec.onstop=res);
  endcard.classList.remove('show'); poster.classList.add('hide');
  tCur=0; playing=true; startStamp=performance.now();
  AudioEngine.start(0);
  cancelAnimationFrame(rafId); rafId=requestAnimationFrame(loop);
  rec.start(200);
  const watch=setInterval(()=>{if(tCur>=DUR-.02||!playing){clearInterval(watch);rec.stop();}},80);
  await done;
  stream.getTracks().forEach(tr=>tr.stop());
  AudioEngine.stop(); if(wasMuted) AudioEngine.setMuted(true);
  const blob=new Blob(chunks,{type:'video/webm'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='xmark-15s-1080p60.webm';
  a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),5000);
  recording=false; document.body.classList.remove('rec');
  document.querySelectorAll('header button,#endcard button').forEach(b=>b.disabled=false);
  endcard.classList.add('show');
  say(`已导出 ${(blob.size/1048576).toFixed(1)} MB · 含配乐`);
}
$('btnPlay').onclick=()=>{poster.classList.add('hide');toggle();};
$('btnReplay').onclick=$('btnReplay2').onclick=()=>{poster.classList.add('hide');seek(0);play();};
$('btnBig').onclick=()=>{poster.classList.add('hide');seek(0);play();};
$('btnExport').onclick=$('btnExport2').onclick=exportWebM;
$('btnMute').onclick=()=>{AudioEngine.setMuted(!AudioEngine.muted);
  $('btnMute').textContent=AudioEngine.muted?'取消静音':'静音';};
$('btnFull').onclick=()=>{document.fullscreenElement?document.exitFullscreen():$('frame').requestFullscreen();};
cv.addEventListener('click',()=>{if(!recording){poster.classList.add('hide');toggle();}});
window.addEventListener('keydown',e=>{
  if(e.target.closest('button')||recording) return;
  if(e.code==='Space'){e.preventDefault();poster.classList.add('hide');toggle();}
  else if(e.key==='ArrowRight'){poster.classList.add('hide');seek(Math.floor(tCur)+1);}
  else if(e.key==='ArrowLeft'){poster.classList.add('hide');seek(Math.ceil(tCur)-1);}
  else if(e.key==='r'||e.key==='R'){poster.classList.add('hide');seek(0);play();}
  else if(e.key==='e'||e.key==='E') exportWebM();
  else if(e.key==='m'||e.key==='M') $('btnMute').click();
  else if(e.key==='f'||e.key==='F') $('btnFull').click();
});
window.__POSTER_T=11.4;
window.__film={seek:t=>{pause();tCur=Math.max(0,Math.min(DUR,t));draw();return tCur;},
  play,pause,get t(){return tCur}};
window.__audio=AudioEngine;

/* ── 10. 启动 ── */
Promise.race([
  Promise.all([['900 100px "Noto Sans SC"','标记'],['500 100px "Noto Sans SC"','标记'],
    ['700 100px "Space Grotesk"','XM'],['500 20px "JetBrains Mono"','TC']]
    .map(([f,txt])=>document.fonts.load(f,txt))),
  new Promise(r=>setTimeout(r,1800)),
]).then(()=>{
  if(!document.fonts.check('900 100px "Noto Sans SC"','标记'))
    say('内嵌字体未生效——已回退系统字体',6000);
  tCur=11.4; draw();     // 海报:logo 诞生帧
});
