<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>XMark · 关注变动</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles/follows.css" />
  </head>
  <body>
    <header class="ft-header">
      <div class="ft-header-in">
        <img src="public/128.png" class="ft-logo" alt="XMark" />
        <h1 class="ft-title" data-key="ftPageTitle">关注变动</h1>
        <span id="ftTodayState" class="ft-state"></span>
        <div class="flex1"></div>
        <span id="ftNotice" class="ft-warn hidden"></span>
      </div>
    </header>

    <main class="ft-main">
      <!-- 月历：有变动的日子标角标（红=取关我，绿=回关我），点选 -->
      <section class="ft-card">
        <div class="ft-cal-head">
          <button class="ft-cal-nav" id="ftPrevMonth">‹</button>
          <b id="ftMonthLabel"></b>
          <button class="ft-cal-nav" id="ftNextMonth">›</button>
          <span class="ft-cal-legend">
            <i class="k-uf"></i><span data-key="ftQuadUnfollowers">取关我</span>
            <i class="k-rf"></i><span data-key="ftQuadRefollowed">回关我</span>
          </span>
        </div>
        <div class="ft-cal-week" id="ftCalWeek"></div>
        <div class="ft-cal-grid" id="ftCalGrid"></div>
      </section>

      <!-- 选中日的两列表 -->
      <section class="ft-lists" id="ftLists"></section>
    </main>

    <script type="module" src="follows.js"></script>
  </body>
</html>
